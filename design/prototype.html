<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的记事簿</title>
<style>
/* ============ 基础 ============ */
* { box-sizing: border-box; }
:root{
  --bg:        #e9ebef;
  --pane:      #ffffff;
  --side:      #f6f7f9;
  --line:      #ececf1;
  --line-soft: #f3f4f7;
  --text:      #1f2328;
  --text-2:    #5b6270;
  --muted:     #9aa0ab;
  --accent:    #4f6ef7;
  --accent-bg: #eaeefd;
  --accent-ink:#3b57d6;
  --high:      #e2483d;
  --med:       #f59f0a;
  --low:       #3b82f6;
  --green:     #34c759;
  --radius:    12px;
  --shadow:    0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
}
html, body { height: 100%; }
body{
  margin: 0;
  font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
input, textarea, select { outline: none; }
::selection { background: #d7e0ff; }

/* 滚动条 */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: #d9dbe2; border: 3px solid transparent; background-clip: content-box; border-radius: 10px; }
*::-webkit-scrollbar-thumb:hover { background: #c3c6d0; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* ============ 窗口骨架 ============ */
.app{
  height: 100vh; min-width: 980px;
  display: grid;
  grid-template-columns: 240px 1fr 452px;
  overflow: hidden;
}
.titlebar{
  grid-column: 1 / -1;
  height: 44px; display: flex; align-items: center; gap: 8px;
  padding: 0 16px; background: var(--side);
  border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}
.lights{ display: flex; gap: 8px; }
.lights i{ width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1){ background: #ff5f57; }
.lights i:nth-child(2){ background: #febc2e; }
.lights i:nth-child(3){ background: #28c840; }
.win-title{ margin-left: 12px; font-size: 12.5px; color: var(--muted); letter-spacing: .2px; }

/* ============ 左侧导航 ============ */
.sidebar{
  background: var(--side);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 18px 14px 14px;
  overflow: hidden;
}
.brand{ display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; }
.brand .logo{
  width: 34px; height: 34px; border-radius: 10px; background: #2b3040; color: #fff;
  display: grid; place-items: center; flex: none;
}
.brand h1{ font-size: 16px; font-weight: 700; margin: 0; letter-spacing: .3px; }

.nav{ display: flex; flex-direction: column; gap: 2px; }
.nav-item{
  display: flex; align-items: center; gap: 10px;
  height: 38px; padding: 0 10px; border-radius: 10px;
  color: var(--text-2); font-size: 14px; text-align: left;
  transition: background .14s ease, color .14s ease;
}
.nav-item .ic{ color: #9aa0ab; display: grid; place-items: center; flex: none; }
.nav-item .label{ flex: 1; }
.nav-item .count{ font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-item:hover{ background: #eef0f4; color: var(--text); }
.nav-item.active{ background: var(--accent-bg); color: var(--accent-ink); font-weight: 600; }
.nav-item.active .ic{ color: var(--accent-ink); }
.nav-item.active .count{ color: var(--accent-ink); opacity: .8; }

.side-sep{ height: 1px; background: var(--line); margin: 14px 6px; }

.side-head{
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px 6px; font-size: 12px; color: var(--muted); letter-spacing: .4px;
}
.side-head button{ width: 22px; height: 22px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.side-head button:hover{ background: #e7e9ee; color: var(--text-2); }

.folders{ display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.folder-item{
  display: flex; align-items: center; gap: 10px; height: 34px;
  padding: 0 10px; border-radius: 9px; color: var(--text-2); font-size: 13.5px; text-align: left;
}
.folder-item .swatch{ width: 9px; height: 9px; border-radius: 3px; flex: none; }
.folder-item .label{ flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-item .count{ font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.folder-item .del{ display: none; width: 20px; height: 20px; border-radius: 6px; color: var(--muted); place-items: center; }
.folder-item:hover{ background: #eef0f4; color: var(--text); }
.folder-item:hover .del{ display: grid; }
.folder-item .del:hover{ background: #e2e4ea; color: var(--high); }
.folder-item.active{ background: #fff; color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.folder-item.active .count{ color: var(--accent-ink); }
.folder-new{ padding: 4px 10px 0; }
.folder-new input{
  width: 100%; height: 32px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--accent); background: #fff; font-size: 13px;
}

.side-foot{ margin-top: auto; padding-top: 12px; }
.btn-add{
  width: 100%; height: 42px; border-radius: 11px; background: var(--accent-bg);
  color: var(--accent-ink); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .14s ease;
}
.btn-add:hover{ background: #dfe6fc; }

/* ============ 中间列表 ============ */
.list-pane{
  background: var(--pane); display: flex; flex-direction: column;
  border-right: 1px solid var(--line); min-width: 0;
}
.list-head{ padding: 22px 26px 12px; display: flex; align-items: flex-start; gap: 12px; }
.list-title{ font-size: 21px; font-weight: 700; margin: 0 0 2px; letter-spacing: .2px; }
.list-sub{ font-size: 12.5px; color: var(--muted); }
.list-tools{ margin-left: auto; display: flex; align-items: center; gap: 4px; padding-top: 4px; }
.ghost-btn{
  height: 30px; padding: 0 10px; border-radius: 8px; color: var(--text-2);
  font-size: 12.5px; display: flex; align-items: center; gap: 6px;
}
.ghost-btn:hover{ background: var(--line-soft); color: var(--text); }
.icon-btn{ width: 30px; height: 30px; border-radius: 8px; color: var(--text-2); display: grid; place-items: center; }
.icon-btn:hover{ background: var(--line-soft); color: var(--text); }

.add-row{ padding: 4px 26px 14px; }
.add-box{
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 10px;
  border: 1px solid #e6e8ee; border-radius: 11px; background: #fff;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.add-box:focus-within{ border-color: #c9d3fb; box-shadow: 0 0 0 3px #eef1fe; }
.add-box .plus{ width: 26px; height: 26px; border-radius: 8px; color: var(--accent); display: grid; place-items: center; flex: none; }
.add-box .plus:hover{ background: var(--accent-bg); }
.add-box input{ flex: 1; border: none; background: transparent; height: 100%; }
.add-box input::placeholder{ color: #b4b9c3; }
.add-box .hint{ font-size: 11.5px; color: #c2c6cf; padding-right: 4px; }

.rows{ flex: 1; overflow-y: auto; padding: 0 14px 22px; }
.group-head{
  display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px;
  font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none;
}
.group-head .chev{ transition: transform .16s ease; display: grid; place-items: center; }
.group-head.collapsed .chev{ transform: rotate(-90deg); }
.group-head .n{ color: #c2c6cf; }

.task{
  display: flex; align-items: center; gap: 10px;
  min-height: 46px; padding: 8px 12px; border-radius: 10px; cursor: default;
  border: 1px solid transparent;
}
.task:hover{ background: #f8f9fb; }
.task.active{ background: #f2f5ff; border-color: #e2e8ff; }
.task .title{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.task .tag{
  display: flex; align-items: center; gap: 6px; flex: none;
  font-size: 12.5px; color: var(--text-2); max-width: 92px;
}
.task .tag .swatch{ width: 9px; height: 9px; border-radius: 3px; flex: none; }
.task .tag .nm{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .due{ width: 74px; text-align: right; font-size: 12.5px; color: var(--text-2); flex: none; font-variant-numeric: tabular-nums; }
.task .due.overdue{ color: var(--high); font-weight: 600; }
.task .due.today{ color: var(--accent-ink); font-weight: 600; }

.task.done{ opacity: .62; }
.task.done .title{ text-decoration: line-through; color: var(--muted); }
.task.done .tag, .task.done .due{ color: var(--muted); }
.task.done .due{ font-weight: 400; }

.check{
  width: 17px; height: 17px; border-radius: 50%; border: 1.6px solid #cfd3db;
  flex: none; display: grid; place-items: center; color: #fff;
  transition: border-color .14s ease, background .14s ease;
}
.check:hover{ border-color: var(--accent); }
.check.square{ border-radius: 5px; border-color: var(--green); background: var(--green); }
.check.square svg{ opacity: 1; }
.check svg{ opacity: 0; }
.check.checked{ background: var(--green); border-color: var(--green); }
.check.checked svg{ opacity: 1; }

.dot{ width: 8px; height: 8px; border-radius: 50%; flex: none; }

.empty{ padding: 46px 20px; text-align: center; color: var(--muted); font-size: 13px; }
.empty .big{ font-size: 15px; color: var(--text-2); margin-bottom: 4px; }

/* ============ 右侧详情 ============ */
.detail-pane{
  background: var(--pane); display: flex; flex-direction: column; min-width: 0;
}
.detail-top{ display: flex; align-items: center; padding: 16px 20px 4px; }
.detail-top .spacer{ flex: 1; }
.detail-scroll{ flex: 1; overflow-y: auto; padding: 4px 32px 28px; }

.detail-title{
  width: 100%; border: none; background: transparent; font-size: 23px; font-weight: 700;
  line-height: 1.35; padding: 6px 0 10px; letter-spacing: .2px;
}
.detail-title::placeholder{ color: #c8ccd4; }

.meta-row{ display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 2px 0 18px; }
.chip{
  display: flex; align-items: center; gap: 6px; height: 27px; padding: 0 9px;
  border-radius: 8px; background: #f6f7f9; font-size: 12.5px; color: var(--text-2);
}
.chip .swatch{ width: 9px; height: 9px; border-radius: 3px; }
.chip .cal{ color: var(--high); display: grid; place-items: center; }
.chip .clock{ color: var(--text-2); display: grid; place-items: center; }
.chip.plain{ background: transparent; padding: 0 2px; }
.chip-col{ display: flex; flex-direction: column; line-height: 1.25; }
.chip-col .k{ font-size: 11px; color: var(--muted); }
.chip-col .v{ font-size: 12.5px; color: var(--text-2); }

.desc-wrap{ position: relative; margin-bottom: 22px; }
.desc-wrap textarea{
  width: 100%; min-height: 116px; resize: vertical; padding: 12px 14px 26px;
  border: 1px solid var(--line); border-radius: 10px; background: #fcfcfd;
  line-height: 1.65; font-size: 13.5px;
}
.desc-wrap textarea:focus{ background: #fff; border-color: #d9e0fb; box-shadow: 0 0 0 3px #f0f3fe; }
.desc-wrap .counter{ position: absolute; right: 12px; bottom: 8px; font-size: 11.5px; color: #c2c6cf; }

.field{ display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
.field > .k{ font-size: 13px; color: var(--muted); }
.control{ display: flex; align-items: center; gap: 8px; min-height: 38px; position: relative; }

.seg{ display: flex; gap: 8px; }
.seg button{
  flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 13px; color: var(--text-2); background: #fff; transition: all .14s ease;
}
.seg button .dot{ width: 9px; height: 9px; }
.seg button:hover{ border-color: #dcdfe7; }
.seg button.on{ font-weight: 600; }
.seg button.on[data-p="high"]  { color: var(--high); border-color: #f6c9c5; background: #fdf1f0; }
.seg button.on[data-p="medium"]{ color: #c47c05;    border-color: #f6dfae; background: #fdf7ec; }
.seg button.on[data-p="low"]   { color: var(--low);  border-color: #cadcfb; background: #f1f6fe; }

.folder-pick{ position: relative; flex: 1; }
.folder-pick .box{
  width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
  display: flex; align-items: center; gap: 9px; padding: 0 12px; font-size: 13.5px; text-align: left;
}
.folder-pick .box:hover{ border-color: #dcdfe7; }
.folder-pick .box .swatch{ width: 12px; height: 12px; border-radius: 4px; flex: none; }
.folder-pick .box .nm{ flex: 1; }
.folder-pick .box .chev{ color: var(--muted); display: grid; place-items: center; }
.folder-pick select{
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; appearance: none;
}

.date-field{
  flex: 1; position: relative; height: 38px; border: 1px solid var(--line); border-radius: 9px;
  background: #fff; display: flex; align-items: center; gap: 9px; padding: 0 40px 0 12px;
  font-size: 13.5px; color: var(--text-2);
}
.date-field:hover{ border-color: #dcdfe7; }
.date-field .lead{ color: var(--text-2); display: grid; place-items: center; flex: none; }
.date-field .txt{ flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.date-field .txt.ph{ color: #b4b9c3; }
.date-field input[type="date"], .date-field input[type="datetime-local"]{
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
  border: none; background: transparent; padding: 0;
}
.date-field .clear{
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; border-radius: 7px; color: var(--muted); display: none; place-items: center; z-index: 2;
}
.date-field:hover .clear{ display: grid; }
.date-field .clear:hover{ background: #f1f2f5; color: var(--high); }

.notes-wrap { padding-top: 14px; }
.notes-wrap textarea{
  width: 100%; min-height: 74px; resize: vertical; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: #fcfcfd;
  line-height: 1.6; font-size: 13.5px;
}
.notes-wrap textarea:focus{ background: #fff; border-color: #d9e0fb; box-shadow: 0 0 0 3px #f0f3fe; }
.notes-wrap textarea::placeholder{ color: #b4b9c3; }
.detail-foot{ display: flex; align-items: center; gap: 10px; padding: 18px 0 4px; }
.danger{ height: 34px; padding: 0 12px; border-radius: 9px; color: var(--high); font-size: 13px; display: flex; align-items: center; gap: 7px; }
.danger:hover{ background: #fdf1f0; }
.detail-foot .stamp{ margin-left: auto; font-size: 11.5px; color: #c2c6cf; }

.detail-empty{ margin: auto; text-align: center; color: var(--muted); padding: 40px; }
.detail-empty .big{ font-size: 15px; color: var(--text-2); margin-bottom: 6px; }

/* ============ 弹出菜单 ============ */
.menu{
  position: fixed; z-index: 60; min-width: 168px; padding: 6px;
  background: #fff; border: 1px solid var(--line); border-radius: 11px;
  box-shadow: 0 10px 30px rgba(16,24,40,.14);
}
.menu button{
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; text-align: left;
  font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 8px;
}
.menu button:hover{ background: #f5f6f9; color: var(--text); }
.menu button.on{ color: var(--accent-ink); font-weight: 600; }
.menu .sep{ height: 1px; background: var(--line); margin: 5px 6px; }
.menu button.danger-ink{ color: var(--high); }
.menu button.danger-ink:hover{ background: #fdf1f0; }
.menu .tick{ width: 14px; display: grid; place-items: center; }

.toast{
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(10px);
  background: #2b3040; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 10px;
  opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 80;
}
.toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
[hidden]{ display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="win-title">我的记事簿</div>
  </div>

  <!-- 左侧导航 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" id="brandLogo"></div>
      <h1>我的记事簿</h1>
    </div>
    <nav class="nav" id="smartNav"></nav>
    <div class="side-sep"></div>
    <div class="side-head">
      <span>文件夹</span>
      <button id="addFolderBtn" title="新增文件夹"></button>
    </div>
    <div class="folders" id="folderList"></div>
    <div class="folder-new" id="folderNew" hidden>
      <input id="folderNewInput" type="text" maxlength="12" placeholder="文件夹名称，回车确认">
    </div>
    <div class="side-foot">
      <button class="btn-add" id="quickAddBtn"><span id="quickAddIc"></span>新增待办</button>
    </div>
  </aside>

  <!-- 中间任务列表 -->
  <section class="list-pane">
    <header class="list-head">
      <div>
        <h2 class="list-title" id="listTitle">收件箱</h2>
        <div class="list-sub" id="listSub">记录一切，整理成行动</div>
      </div>
      <div class="list-tools">
        <button class="ghost-btn" id="sortBtn"><span id="sortLabel">按创建时间</span><span id="sortChev"></span></button>
        <button class="icon-btn" id="moreBtn"></button>
      </div>
    </header>

    <div class="add-row">
      <div class="add-box">
        <button class="plus" id="addPlus" title="新增"></button>
        <input id="addInput" type="text" maxlength="140" placeholder="新增待办 ..." autocomplete="off">
        <span class="hint">回车连续添加</span>
      </div>
    </div>

    <div class="rows" id="rows"></div>
  </section>

  <!-- 右侧详情 -->
  <aside class="detail-pane" id="detailPane"></aside>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   我的记事簿 · 轻量化桌面待办
   数据保存在 localStorage，纯前端单文件，无依赖
   ========================================================= */

/* ---------- 图标 ---------- */
const ICON = {
  brand:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9l1.2 2H19a1 1 0 0 1 1 1v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18Z"/></svg>',
  inbox:   '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13h5l1 2h5l1-2h5"/><path d="M5.2 5.5h13.6l1.7 7.5v4.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V13Z"/></svg>',
  today:   '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>',
  upcoming:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>',
  done:    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.4l2.6 2.5 4.8-5"/></svg>',
  plus:    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:       '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>',
  more:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18.5" cy="12" r="1.5"/></svg>',
  cal:     '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>',
  clock:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>',
  flag:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 5h11l-1.6 3.6L17 12H6"/></svg>',
  trash:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V5h5v2M7 7l1 12.5h8L17 7"/></svg>',
  check:   '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.6 4.4L19 6.5"/></svg>'
};

/* ---------- 常量 ---------- */
const STORE_KEY = 'memo-book-v1';
const DESC_MAX = 1000;
const PRIORITY = {
  high:   { label: '高', color: '#e2483d' },
  medium: { label: '中', color: '#f59f0a' },
  low:    { label: '低', color: '#3b82f6' }
};
const P_COLORS = { orange:'#f0a12f', green:'#34c759', blue:'#3b82f6', purple:'#8b5cf6', pink:'#ec4899', teal:'#14b8a6' };
const PALETTE_ORDER = ['orange','green','blue','purple','pink','teal'];
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const SMART = {
  inbox:    { label: '收件箱',  sub: '记录一切，整理成行动', icon: 'inbox' },
  today:    { label: '今天',    sub: '今天要完成的事',       icon: 'today' },
  upcoming: { label: '即将到来', sub: '已经排好期的待办',     icon: 'upcoming' },
  done:     { label: '已完成',  sub: '已经收尾的记录',       icon: 'done' }
};
const SORTS = { created: '按创建时间', due: '按截止日期', priority: '按优先级' };

/* ---------- 日期工具 ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const shiftISO = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
function parseISO(s) {
  if (!s) return null;
  const p = String(s).slice(0, 10).split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[0], p[1] - 1, p[2]);
}
const fmtMD  = s => { const d = parseISO(s); return d ? `${d.getMonth() + 1}月${d.getDate()}日` : ''; };
const fmtFull = s => { const d = parseISO(s); return d ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日` : ''; };
const fmtMDW = s => { const d = parseISO(s); return d ? `${d.getMonth() + 1}月${d.getDate()}日 (${WEEK[d.getDay()]})` : ''; };
function fmtDateTime(v) {
  if (!v) return '';
  const [d, t] = String(v).split('T');
  if (!d) return '';
  return `${fmtMD(d)}${t ? ' ' + t.slice(0, 5) : ''}`;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- 状态 ---------- */
let store = { tasks: [], folders: [], ui: { view: { type: 'smart', id: 'inbox' }, sort: 'created', selected: null, showDone: true } };
let saveTimer = null;

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
  }, 120);
}

function seed() {
  const f = [
    { id: 'work',  name: '工作', color: 'orange', builtin: true },
    { id: 'life',  name: '生活', color: 'green',  builtin: true },
    { id: 'study', name: '学习', color: 'blue',   builtin: true }
  ];
  const T = (title, folderId, priority, dueOffset, extra = {}) => Object.assign({
    id: uid(), title, desc: '', notes: '', done: false, priority, folderId,
    startDate: null, dueDate: dueOffset === null ? null : shiftISO(dueOffset),
    remindAt: null, createdAt: Date.now(), completedAt: null
  }, extra);
  const tasks = [
    T('完成项目方案初稿', 'work', 'high', 0, {
      desc: '基于用户调研结果，完成项目方案初稿。\n重点包括：\n1. 目标与背景\n2. 方案设计\n3. 预期效果\n\n下一周一与团队同步讨论。',
      startDate: shiftISO(-2), remindAt: shiftISO(0) + 'T09:00'
    }),
    T('预约年度体检', 'life', 'medium', 1, { startDate: shiftISO(0) }),
    T('阅读《高效能人士的七个习惯》', 'study', 'medium', 3),
    T('整理桌面与文件', 'life', 'low', 0),
    T('准备下周会议材料', 'work', 'high', -1),
    T('购买生日礼物', 'life', 'medium', 2),
    T('复习英语单词', 'study', 'low', 6),
    T('制定 5 月健身计划', 'life', 'low', 7),
    T('提交上周工作总结', 'work', 'medium', -3, { done: true, completedAt: Date.now() - 864e5 * 3 }),
    T('清理邮箱', 'work', 'low', -4, { done: true, completedAt: Date.now() - 864e5 * 4 }),
    T('看完《人类简史》第三章', 'study', 'low', -5, { done: true, completedAt: Date.now() - 864e5 * 5 }),
    T('整理上周会议纪要', 'work', 'low', -2, { done: true, completedAt: Date.now() - 864e5 * 2 }),
    T('缴纳水电费', 'life', 'low', -1, { done: true, completedAt: Date.now() - 864e5 })
  ];
  return { tasks, folders: f, ui: { view: { type: 'smart', id: 'inbox' }, sort: 'created', selected: null, showDone: true } };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) { store = seed(); return; }
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.tasks)) { store = seed(); return; }
    store = {
      tasks: data.tasks.map(t => Object.assign({
        id: uid(), title: '未命名待办', desc: '', notes: '', done: false,
        priority: 'low', folderId: null, startDate: null, dueDate: null,
        remindAt: null, createdAt: Date.now(), completedAt: null
      }, t)),
      folders: Array.isArray(data.folders) ? data.folders : [],
      ui: Object.assign({ view: { type: 'smart', id: 'inbox' }, sort: 'created', selected: null, showDone: true }, data.ui || {})
    };
    if (!SMART[store.ui.view.id] && store.ui.view.type === 'smart') store.ui.view = { type: 'smart', id: 'inbox' };
  } catch (e) { store = seed(); }
}

/* ---------- 查询 ---------- */
const getTask = id => store.tasks.find(t => t.id === id) || null;
const getFolder = id => store.folders.find(f => f.id === id) || null;
const folderColor = id => { const f = getFolder(id); return f ? P_COLORS[f.color] || '#c7ccd6' : '#c7ccd6'; };
const folderName = id => { const f = getFolder(id); return f ? f.name : '未分类'; };

function counts() {
  const today = todayISO();
  const c = { inbox: 0, today: 0, upcoming: 0, done: 0 };
  store.folders.forEach(f => c['f:' + f.id] = 0);
  store.tasks.forEach(t => {
    if (t.done) { c.done++; return; }
    c.inbox++;
    if (t.folderId && c['f:' + t.folderId] !== undefined) c['f:' + t.folderId]++;
    if (t.dueDate && t.dueDate <= today) c.today++;
    else if (t.dueDate) c.upcoming++;
  });
  return c;
}

function activeView() { return store.ui.view; }

/** 当前视图下的任务（未完成/已完成分组） */
function viewTasks() {
  const v = activeView(), today = todayISO();
  const inView = t => {
    if (v.type === 'smart') {
      if (v.id === 'done') return t.done;
      if (t.done) return false;
      if (v.id === 'inbox') return true;
      if (v.id === 'today') return !!t.dueDate && t.dueDate <= today;
      if (v.id === 'upcoming') return !!t.dueDate && t.dueDate > today;
      return true;
    }
    return t.folderId === v.id;
  };
  const pool = store.tasks.filter(inView);
  const active = pool.filter(t => !t.done);
  const done = pool.filter(t => t.done);
  sortList(active); sortList(done);
  return { active, done };
}

function sortList(arr) {
  const s = store.ui.sort;
  arr.sort((a, b) => {
    if (s === 'due') {
      const av = a.dueDate || '9999-99-99', bv = b.dueDate || '9999-99-99';
      if (av !== bv) return av < bv ? -1 : 1;
      return b.createdAt - a.createdAt;
    }
    if (s === 'priority') {
      const w = { high: 0, medium: 1, low: 2 };
      const d = (w[a.priority] ?? 3) - (w[b.priority] ?? 3);
      if (d) return d;
      return a.createdAt - b.createdAt;
    }
    return a.createdAt - b.createdAt;
  });
  return arr;
}

/* ---------- 操作 ---------- */
function addTask(title, patch = {}) {
  const t = Object.assign({
    id: uid(), title: title.trim(), desc: '', notes: '', done: false, priority: 'low',
    folderId: null, startDate: null, dueDate: null, remindAt: null,
    createdAt: Date.now(), completedAt: null
  }, patch);
  store.tasks.unshift(t);
  return t;
}

function patchTask(id, patch) {
  const t = getTask(id);
  if (!t) return;
  Object.assign(t, patch);
  if ('done' in patch) t.completedAt = patch.done ? Date.now() : null;
  save(); renderAll();
}

function toggleDone(id) {
  const t = getTask(id);
  if (!t) return;
  patchTask(id, { done: !t.done });
  toast(t.done ? '已完成' : '已恢复为未完成');
}

function deleteTask(id) {
  store.tasks = store.tasks.filter(t => t.id !== id);
  if (store.ui.selected === id) store.ui.selected = null;
  save(); renderAll(); toast('已删除');
}

function addFolder(name) {
  const n = (name || '').trim();
  if (!n) return null;
  const used = store.folders.map(f => f.color);
  const color = PALETTE_ORDER.find(c => !used.includes(c)) || PALETTE_ORDER[store.folders.length % PALETTE_ORDER.length];
  const f = { id: 'f_' + uid(), name: n, color };
  store.folders.push(f);
  save(); renderAll();
  return f;
}

function deleteFolder(id) {
  const f = getFolder(id);
  if (!f) return;
  if (!confirm(`删除文件夹「${f.name}」？其中的待办会移动到「未分类」。`)) return;
  store.folders = store.folders.filter(x => x.id !== id);
  store.tasks.forEach(t => { if (t.folderId === id) t.folderId = null; });
  if (activeView().type === 'folder' && activeView().id === id) store.ui.view = { type: 'smart', id: 'inbox' };
  save(); renderAll();
}

/* ---------- 渲染：左侧 ---------- */
const $ = id => document.getElementById(id);

function renderSidebar() {
  const c = counts();
  $('smartNav').innerHTML = Object.keys(SMART).map(k => {
    const v = SMART[k], on = activeView().type === 'smart' && activeView().id === k;
    return `<button class="nav-item${on ? ' active' : ''}" data-nav="smart" data-id="${k}">
      <span class="ic">${ICON[v.icon]}</span><span class="label">${v.label}</span><span class="count">${c[k]}</span>
    </button>`;
  }).join('');

  $('folderList').innerHTML = store.folders.map(f => {
    const on = activeView().type === 'folder' && activeView().id === f.id;
    return `<button class="folder-item${on ? ' active' : ''}" data-nav="folder" data-id="${f.id}">
      <span class="swatch" style="background:${P_COLORS[f.color] || '#c7ccd6'}"></span>
      <span class="label">${esc(f.name)}</span>
      <span class="count">${c['f:' + f.id] || 0}</span>
      <span class="del" data-del-folder="${f.id}" title="删除文件夹">${ICON.x}</span>
    </button>`;
  }).join('');
}

/* ---------- 渲染：列表 ---------- */
function renderList() {
  const v = activeView(), isDoneView = v.type === 'smart' && v.id === 'done';
  if (v.type === 'smart') {
    $('listTitle').textContent = SMART[v.id].label;
    $('listSub').textContent = SMART[v.id].sub;
  } else {
    $('listTitle').textContent = folderName(v.id);
    $('listSub').textContent = '按文件夹归类，保持专注';
  }
  $('sortLabel').textContent = SORTS[store.ui.sort] || SORTS.created;

  const { active, done } = viewTasks();
  const rows = [];

  if (isDoneView) {
    rows.push(done.length ? done.map(t => rowHTML(t, true)).join('')
      : `<div class="empty"><div class="big">还没有已完成的待办</div>完成的待办会收在这里</div>`);
  } else {
    rows.push(active.length ? active.map(t => rowHTML(t, false)).join('') : emptyHTML(v));
    if (done.length) {
      const collapsed = !store.ui.showDone;
      rows.push(`<div class="group-head${collapsed ? ' collapsed' : ''}" id="doneGroup">
        <span class="chev">${ICON.chev}</span><span>已完成</span><span class="n">${done.length}</span>
      </div>`);
      rows.push(`<div id="doneBody"${collapsed ? ' hidden' : ''}>${done.map(t => rowHTML(t, true)).join('')}</div>`);
    }
  }
  $('rows').innerHTML = rows.join('');
}

function emptyHTML(v) {
  const map = {
    inbox: ['收件箱是空的', '在上方输入框写下第一件待办'],
    today: ['今天没有待办', '好好休息，或者安排点新计划'],
    upcoming: ['没有排期的待办', '给待办加上截止日期，就会出现在这里']
  };
  const [big, sub] = map[v.id] || ['这个文件夹还是空的', '在上方输入框新增一条待办'];
  return `<div class="empty"><div class="big">${big}</div>${sub}</div>`;
}

function rowHTML(t, done) {
  const today = todayISO();
  const pr = PRIORITY[t.priority] || PRIORITY.low;
  const cls = ['task'];
  if (done) cls.push('done');
  if (store.ui.selected === t.id) cls.push('active');
  let dueCls = '';
  if (!done && t.dueDate) {
    if (t.dueDate < today) dueCls = ' overdue';
    else if (t.dueDate === today) dueCls = ' today';
  }
  const folder = getFolder(t.folderId);
  const tag = folder
    ? `<span class="tag"><span class="swatch" style="background:${P_COLORS[folder.color] || '#c7ccd6'}"></span><span class="nm">${esc(folder.name)}</span></span>`
    : `<span class="tag"><span class="swatch" style="background:#dcdfe6"></span><span class="nm">未分类</span></span>`;
  return `<div class="${cls.join(' ')}" data-task="${t.id}">
    <button class="check${done ? ' square' : ''}${done ? '' : ''}" data-check="${t.id}" aria-label="完成">${ICON.check}</button>
    <span class="dot" style="background:${done ? '#d4d7de' : pr.color}"></span>
    <span class="title">${esc(t.title)}</span>
    ${tag}
    <span class="due${dueCls}">${t.dueDate ? fmtMD(t.dueDate) : ''}</span>
  </div>`;
}

/* ---------- 渲染：详情 ---------- */
function renderDetail() {
  const pane = $('detailPane');
  const t = store.ui.selected ? getTask(store.ui.selected) : null;
  if (!t) {
    pane.innerHTML = `<div class="detail-empty"><div class="big">选择一条待办查看详情</div>也可以直接在上方输入框新增</div>`;
    return;
  }
  const today = todayISO();
  const pr = PRIORITY[t.priority] || PRIORITY.low;
  const folder = getFolder(t.folderId);
  const dueChip = t.dueDate
    ? `<span class="chip"><span class="cal">${ICON.cal}</span>${fmtMDW(t.dueDate)}${t.dueDate < today && !t.done ? ' · 已逾期' : ''}</span>` : '';
  const remindChip = t.remindAt
    ? `<span class="chip plain"><span class="clock">${ICON.clock}</span><span class="chip-col"><span class="k">提醒</span><span class="v">${fmtDateTime(t.remindAt)}</span></span></span>` : '';

  pane.innerHTML = `
    <div class="detail-top">
      <button class="check${t.done ? ' checked' : ''}" id="dCheck" aria-label="切换完成">${ICON.check}</button>
      <span class="spacer"></span>
      <button class="icon-btn" id="dClose" title="关闭详情">${ICON.x}</button>
    </div>
    <div class="detail-scroll">
      <input class="detail-title" id="dTitle" value="${esc(t.title)}" placeholder="待办标题" maxlength="140" ${t.done ? 'style="text-decoration:line-through;color:#9aa0ab"' : ''}>

      <div class="meta-row">
        <span class="chip"><span class="swatch" style="background:${folder ? (P_COLORS[folder.color] || '#c7ccd6') : '#dcdfe6'}"></span>${esc(folderName(t.folderId))}</span>
        ${dueChip}
        ${remindChip}
        <span class="chip"><span class="swatch" style="background:${pr.color}"></span>${pr.label}优先级</span>
      </div>

      <div class="desc-wrap">
        <textarea id="dDesc" maxlength="${DESC_MAX}" placeholder="补充说明、拆解步骤、参考链接 ...">${esc(t.desc)}</textarea>
        <span class="counter" id="dCounter">${(t.desc || '').length} / ${DESC_MAX}</span>
      </div>

      <div class="field">
        <span class="k">优先级</span>
        <div class="control">
          <div class="seg" id="dSeg">
            ${['high', 'medium', 'low'].map(p => `<button data-p="${p}" class="${t.priority === p ? 'on' : ''}"><span class="dot" style="background:${PRIORITY[p].color}"></span>${PRIORITY[p].label}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="field">
        <span class="k">所属文件夹</span>
        <div class="control">
          <div class="folder-pick">
            <div class="box">
              <span class="swatch" style="background:${folder ? (P_COLORS[folder.color] || '#c7ccd6') : '#dcdfe6'}"></span>
              <span class="nm">${esc(folderName(t.folderId))}</span>
              <span class="chev">${ICON.chev}</span>
            </div>
            <select id="dFolder">
              <option value=""${!t.folderId ? ' selected' : ''}>未分类</option>
              ${store.folders.map(f => `<option value="${f.id}"${t.folderId === f.id ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      ${dateField('startDate', '排期', 'date', t.startDate, ICON.cal, '选择开始日期')}
      ${dateField('dueDate', '截止日期', 'date', t.dueDate, ICON.cal, '选择截止日期')}
      ${dateField('remindAt', '提醒', 'datetime-local', t.remindAt, ICON.clock, '设置提醒时间')}

      <div class="notes-wrap">
        <textarea id="dNotes" placeholder="添加备注 ...">${esc(t.notes)}</textarea>
      </div>

      <div class="detail-foot">
        <button class="danger" id="dDelete">${ICON.trash}删除待办</button>
        <span class="stamp">${t.done && t.completedAt ? '完成于 ' + new Date(t.completedAt).toLocaleDateString('zh-CN') : '创建于 ' + new Date(t.createdAt).toLocaleDateString('zh-CN')}</span>
      </div>
    </div>`;
}

function dateField(key, label, type, value, icon, placeholder) {
  const text = type === 'date'
    ? (value ? fmtFull(value) : placeholder)
    : (value ? fmtDateTime(value) : placeholder);
  const ph = value ? '' : ' ph';
  return `<div class="field">
    <span class="k">${label}</span>
    <div class="control">
      <div class="date-field">
        <span class="lead">${icon}</span>
        <span class="txt${ph}" data-txt="${key}">${text}</span>
        <input type="${type}" data-date="${key}" value="${value || ''}">
        <button class="clear" data-clear="${key}" title="清除">${ICON.x}</button>
      </div>
    </div>
  </div>`;
}

function renderAll() { renderSidebar(); renderList(); renderDetail(); }

/* ---------- 菜单 / 提示 ---------- */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, items) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = items.map((it, i) => it === '-' ? '<div class="sep"></div>'
    : `<button data-i="${i}" class="${it.on ? 'on' : ''}${it.danger ? ' danger-ink' : ''}">
         <span class="tick">${it.on ? ICON.check : ''}</span>${it.label}</button>`).join('');
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';
  m.style.top = Math.min(r.bottom + 6, window.innerHeight - h - 8) + 'px';
  m.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    const it = items[+b.dataset.i];
    closeMenu();
    it && it.run && it.run();
  });
  menuEl = m;
}
document.addEventListener('mousedown', e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
window.addEventListener('blur', closeMenu);

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- 事件 ---------- */
function currentViewDefaults() {
  const v = activeView(), patch = {};
  if (v.type === 'folder') patch.folderId = v.id;
  if (v.type === 'smart' && v.id === 'today') patch.dueDate = todayISO();
  if (v.id === 'done') patch.done = true;
  return patch;
}

function commitAdd() {
  const input = $('addInput');
  const val = input.value.trim();
  if (!val) return;
  const patch = currentViewDefaults();
  // 在“已完成”视图新增时，直接落到收件箱
  if (patch.done) { delete patch.done; store.ui.view = { type: 'smart', id: 'inbox' }; renderSidebar(); renderList(); }
  const t = addTask(val, patch);
  input.value = '';
  store.ui.selected = t.id;
  save(); renderAll();
  input.focus();
  return t;
}

function init() {
  load();
  $('brandLogo').innerHTML = ICON.brand;
  $('addPlus').innerHTML = ICON.plus;
  $('quickAddIc').innerHTML = ICON.plus;
  $('addFolderBtn').innerHTML = ICON.plus;
  $('moreBtn').innerHTML = ICON.more;
  $('sortChev').innerHTML = ICON.chev;

  renderAll();

  /* 左侧导航 */
  $('smartNav').addEventListener('click', e => {
    const b = e.target.closest('[data-nav]');
    if (!b) return;
    store.ui.view = { type: b.dataset.nav, id: b.dataset.id };
    store.ui.selected = null;
    save(); renderAll();
  });
  $('folderList').addEventListener('click', e => {
    const del = e.target.closest('[data-del-folder]');
    if (del) { e.stopPropagation(); deleteFolder(del.dataset.delFolder); return; }
    const b = e.target.closest('[data-nav]');
    if (!b) return;
    store.ui.view = { type: 'folder', id: b.dataset.id };
    store.ui.selected = null;
    save(); renderAll();
  });

  /* 新增文件夹 */
  const openFolderInput = () => {
    const wrap = $('folderNew');
    wrap.hidden = false;
    $('folderNewInput').value = '';
    $('folderNewInput').focus();
  };
  $('addFolderBtn').addEventListener('click', openFolderInput);
  $('folderNewInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const f = addFolder(e.target.value);
      $('folderNew').hidden = true;
      if (f) toast(`已新增文件夹「${f.name}」`);
    } else if (e.key === 'Escape') { $('folderNew').hidden = true; }
  });
  $('folderNewInput').addEventListener('blur', () => { $('folderNew').hidden = true; });

  /* 快速新增 */
  $('quickAddBtn').addEventListener('click', () => $('addInput').focus());
  $('addPlus').addEventListener('click', commitAdd);
  $('addInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commitAdd(); }
    if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); }
  });

  /* 列表交互 */
  $('rows').addEventListener('click', e => {
    const chk = e.target.closest('[data-check]');
    if (chk) { e.stopPropagation(); toggleDone(chk.dataset.check); return; }
    const head = e.target.closest('#doneGroup');
    if (head) { store.ui.showDone = !store.ui.showDone; save(); renderList(); return; }
    const row = e.target.closest('[data-task]');
    if (row) {
      store.ui.selected = row.dataset.task;
      save(); renderList(); renderDetail();
      const inp = $('dTitle'); if (inp) inp.focus();
    }
  });
  $('rows').addEventListener('dblclick', e => {
    const row = e.target.closest('[data-task]');
    if (row) toggleDone(row.dataset.task);
  });

  /* 排序 / 更多 */
  $('sortBtn').addEventListener('click', () => {
    openMenu($('sortBtn'), Object.keys(SORTS).map(k => ({
      label: SORTS[k], on: store.ui.sort === k,
      run: () => { store.ui.sort = k; save(); renderList(); }
    })));
  });
  $('moreBtn').addEventListener('click', () => {
    const doneCount = store.tasks.filter(t => t.done).length;
    openMenu($('moreBtn'), [
      { label: `清除已完成 (${doneCount})`, run: () => {
          if (!doneCount) return toast('暂无已完成待办');
          if (!confirm(`删除 ${doneCount} 条已完成待办？`)) return;
          store.tasks = store.tasks.filter(t => !t.done);
          if (!getTask(store.ui.selected)) store.ui.selected = null;
          save(); renderAll(); toast('已清除已完成');
        } },
      { label: '全部标记为已完成', run: () => {
          store.tasks.forEach(t => { if (!t.done) { t.done = true; t.completedAt = Date.now(); } });
          save(); renderAll(); toast('已全部标记完成');
        } },
      '-',
      { label: '恢复示例数据', danger: true, run: () => {
          if (!confirm('将清空当前所有待办并恢复示例数据？')) return;
          store = seed(); save(); renderAll(); toast('已恢复示例数据');
        } }
    ]);
  });

  /* 详情面板 */
  $('detailPane').addEventListener('click', e => {
    const t = store.ui.selected ? getTask(store.ui.selected) : null;
    if (!t) return;

    if (e.target.closest('#dClose')) { store.ui.selected = null; save(); renderList(); renderDetail(); return; }
    if (e.target.closest('#dCheck')) { toggleDone(t.id); return; }
    if (e.target.closest('#dDelete')) {
      if (confirm(`删除「${t.title}」？`)) deleteTask(t.id);
      return;
    }
    const seg = e.target.closest('#dSeg button');
    if (seg) { patchTask(t.id, { priority: seg.dataset.p }); return; }
    const clr = e.target.closest('[data-clear]');
    if (clr) { patchTask(t.id, { [clr.dataset.clear]: null }); return; }
  });

  $('detailPane').addEventListener('input', e => {
    const t = store.ui.selected ? getTask(store.ui.selected) : null;
    if (!t) return;
    const el = e.target;
    if (el.id === 'dTitle') { t.title = el.value; save(); syncRow(t); }
    else if (el.id === 'dDesc') { t.desc = el.value.slice(0, DESC_MAX); $('dCounter').textContent = `${t.desc.length} / ${DESC_MAX}`; save(); }
    else if (el.id === 'dNotes') { t.notes = el.value; save(); }
  });
  $('detailPane').addEventListener('change', e => {
    const t = store.ui.selected ? getTask(store.ui.selected) : null;
    if (!t) return;
    const el = e.target;
    if (el.id === 'dFolder') { patchTask(t.id, { folderId: el.value || null }); return; }
    if (el.dataset && el.dataset.date) {
      const key = el.dataset.date;
      const val = el.value || null;
      const patch = { [key]: val };
      // 提醒时间跟随截止日期，便于快速安排
      if (key === 'dueDate' && val && t.remindAt && t.remindAt.slice(0, 10) !== val.slice(0, 10)) {
        patch.remindAt = val + 'T' + t.remindAt.slice(11, 16);
      }
      patchTask(t.id, patch);
    }
  });
  $('detailPane').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'dTitle') { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Escape' && e.target.tagName === 'INPUT') e.target.blur();
  });

  /* 全局键盘 */
  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === 'Escape') { closeMenu(); if (!typing) { store.ui.selected = null; save(); renderList(); renderDetail(); } }
    if (typing) return;
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); $('addInput').focus(); }
    if (e.key === '1') { store.ui.view = { type: 'smart', id: 'inbox' }; renderAll(); }
    if (e.key === '2') { store.ui.view = { type: 'smart', id: 'today' }; renderAll(); }
    if (e.key === '3') { store.ui.view = { type: 'smart', id: 'upcoming' }; renderAll(); }
    if (e.key === '4') { store.ui.view = { type: 'smart', id: 'done' }; renderAll(); }
  });

  setInterval(() => { if (!document.hidden) renderSidebar(); }, 60000);

  window.addEventListener('beforeunload', () => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
  });
}

/** 只刷新列表中被编辑任务的那一行，避免打字时丢失焦点 */
function syncRow(t) {
  const row = document.querySelector(`[data-task="${t.id}"] .title`);
  if (row) row.textContent = t.title;
  const meta = document.querySelector('.meta-row');
  if (meta && store.ui.selected === t.id) {
    const nm = meta.querySelector('.chip .nm') || meta.querySelector('.chip');
  }
}

init();
</script>
</body>
</html>
