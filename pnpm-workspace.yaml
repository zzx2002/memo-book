# pnpm 配置（v11+ 起，此文件同时是项目级设置的规范位置；.npmrc 现在只读 registry/auth）
#
# allowBuilds 取代了 v10 时代已被移除的 onlyBuiltDependencies。
# 不声明的话，strictDepBuilds 默认 true，未审批的构建脚本会让 install 直接失败
# （ERR_PNPM_IGNORED_BUILDS）。esbuild 需要跑 postinstall，必须显式放行。
allowBuilds:
  esbuild: true

# minimumReleaseAge 这里刻意不写，保持 pnpm 12 的内置默认（1440 分钟 / 24 小时）。
# 新版本发布的包会被延迟 24 小时才允许安装，用来挡供应链投毒。
# 如果以后想立刻用上刚发布的版本（例如 Tauri 新版 CLI），改成：
#   minimumReleaseAge: 0
# 或者保留防护、只给特定包开口子：
#   minimumReleaseAge: 1440
#   minimumReleaseAgeExclude:
#     - '@tauri-apps/*'
